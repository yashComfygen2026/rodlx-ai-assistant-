pacing:.8px;font-weight:800;color:#66798d;text-transform:uppercase;margin-bottom:5px}.empty{text-align:center;margin:auto;color:var(--muted);padding:45px 20px;max-width:420px}.empty-mark{font-size:32px;margin-bottom:14px}.actions{border-top:1px solid var(--line);padding:16px 22px;display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}.outcome{margin-top:17px;border:1px solid #dce7d2;border-radius:12px;padding:15px;background:#f5f9ef;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.outcome strong{display:block;margin-top:5px;font-size:13px}.bottom{margin-top:22px}.records{display:grid;grid-template-columns:1fr 1fr;gap:12px}.record{padding:15px;border:1px solid var(--line);background:#fafbfd;border-radius:10px;font-size:12px}.record strong{display:block;margin:5px 0 9px}.record p{font-size:11px;color:var(--muted)}.config{margin-top:22px}.config summary{padding:20px 22px;cursor:pointer;font-size:14px;font-weight:750}.config-body{border-top:1px solid var(--line);padding:20px 22px}.copy-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.review-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.footer-note{margin-top:25px;color:var(--muted);font-size:11px;line-height:1.7}.feedback{min-height:20px;font-size:12px;color:#61713b;margin-top:10px}.store-only{display:none}body[data-audience=store] .admin-only{display:none!important}body[data-audience=store] .store-only{display:block}body[data-standalone=false] .standalone-only{display:none}.route-pill{font-family:ui-monospace,monospace;font-size:11px}.reviewer{display:flex;gap:10px;align-items:center}.reviewer select{margin:0;font-size:12px;padding:6px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){header{padding:18px}main{padding:22px 16px}.grid{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:24px}.copy-grid,.records{grid-template-columns:1fr}.top{align-items:flex-start}.reviewer{flex-direction: <body data-audience="admin" data-standalone="true">
<header><div class="top"><div><div class="brand">ROD<span>LX</span></div><div class="eyebrow" data-i18n="workspace"></div></div><div class="reviewer"><div class="languages" role="group" aria-label="Language"><button id="english" type="button" lang="en" aria-pressed="true">English</button><button id="spanish" type="button" lang="es" aria-pressed="false">Español</button></div><label class="standalone-only"><span class="screen-reader">Preview audience</span><select id="audience"><option value="admin" data-i18n="adminPreview"></option><option value="store" data-i18n="storePreview"></option></select></label></div></div></header>

<div class="notice" data-i18n="notice"></div>
<div class="heading"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 id="pageTitle"></h1><p class="sub" data-i18n="subtitle"></p></div><span class="pill warn" data-i18n="draft"></span></div>
<div class="grid">
<section class="card section"><h2 class="card-title"><span class="step">1</span><span data-i18n="setup"></span></h2>

<label class="check admin-only"><input type="checkbox" id="verified"><span><b data-i18n="verified"></b><br><span data-i18n="verifiedHelp"></span></span></label>
<label class="check"><input type="checkbox" id="consent"><span><b data-i18n="consent"></b><br><span data-i18n="consentHelp"></span></span></label>

<div>
<section class="card"><div class="conversation-header"><div class="identity"><div class="avatar">R</div><div><div style="font-size:13px;font-weight:750" data-i18n="assistant"></div><div class="help" style="margin:1px 0" data-i18n="scripted"></div></div></div><button type="button" class="button" id="listen" data-i18n="listen"></button></div>

</section>

</div>
</div>
<section class="card section bottom"><h2 class="card-title"><span class="step">2</span><span data-i18n="records"></span> <span class="pill" style="float:right" data-i18n="sampleOnly"></span></h2><div id="records" class="records"></div></section>

<p class="footer-note" data-i18n="footer"></p>
</main>

// Client-review simulation only. No provider, database, account lookup, or external requests.

const DEMO_SCENARIOS = [
  { id: 'delayed', EN: 'Technician delayed', ES: 'Retraso del técnico' },
  { id: 'registration', EN: 'New caller / registration', ES: 'Nuevo cliente / registro' },
  { id: 'urgent', EN: 'Urgent roadside concern', ES: 'Consulta vial urgente' },
  { id: 'billing', EN: 'Billing dispute', ES: 'Disputa de facturación' },
  { id: 'outage', EN: 'AI outage / keypad fallback', ES: 'Falla de IA / menú de respaldo' },
  { id: 'masked', EN: 'Masked message', ES: 'Mensaje enmascarado' },
  { id: 'expired', EN: 'Completed or cancelled order', ES: 'Orden completada o cancelada' },
  { id: 'store', EN: 'Store pickup support', ES: 'Soporte de recogida en tienda' },
];

function simulateCommunication(input = {}, audience = 'admin') {
  const { language = 'EN', scenario = audience === 'store' ? 'store' : 'delayed',
    verified = false, consent = false, availability = 'available', action = 'start' } = input;
  if (!['EN', 'ES'].includes(language) || !DEMO_SCENARIOS.some(s => s.id === scenario) ||
      !['available', 'backup', 'unavailable'].includes(availability) ||
      !['start', 'agent', 'callback', 'ticket', 'sms'].includes(action) ||
      typeof verified !== 'boolean' || typeof consent !== 'boolean' || !['admin', 'store'].includes(audience)) {
    throw Object.assign(new Error('Invalid demo scenario input.'), { statusCode: 400 });
  }
  if (audience === 'store' && !['store', 'outage', 'urgent'].includes(scenario)) {
    throw Object.assign(new Error('This scenario is not available in the store preview.'), { statusCode: 403 });
  }
  const copy = DEMO_COPY[language];
  const transcript = [{ speaker: 'system', text: copy.greeting }];
  const add = text => transcript.push({ speaker: 'assistant', text });
  let route = scenario === 'outage' ? 'keypad_fallback' : 'ai_demo';
  const records = [];
  const privateScenario = ['delayed', 'billing', 'masked'].includes(scenario);
  const context = { verified: privateScenario && verified, language, scenario, serviceOrder: null };
  if (scenario === 'expired') {
    add(copy.expired);
    return { simulated: true, contentStatus: 'draft', language, route: 'access_ended', transcript, context, records };
  }
  if (privateScenario && !verified) {
    add(copy.verify);
    return { simulated: true, contentStatus: 'draft', language, route: 'verification_required', transcript, context, records };
  }
  if (privateScenario) context.serviceOrder = 'DEMO-ORDER-001';
  if (scenario !== 'urgent') add(scenario === 'outage' ? copy.fallback : copy.intro);
  if (!['outage', 'masked'].includes(scenario)) add(copy[scenario === 'registration' ? 'registration' : scenario === 'urgent' ? 'safety' : scenario]);

  if (action === 'sms' || scenario === 'masked') {
    route = consent ? 'sms_preview' : 'consent_required';
    add(consent ? (scenario === 'masked' ? copy.masked : scenario === 'store' ? copy.storeSms : copy.sms) : copy.consent);
  }
  if ((['urgent', 'billing'].includes(scenario) && action === 'start') || action === 'agent') {
    route = availability === 'available' ? 'warm_transfer' : availability === 'backup' ? 'on_call_backup' : 'callback_offered';
    add(copy[availability === 'available' ? 'warm' : availability === 'backup' ? 'backup' : 'unavailable']);
  }
  if (action === 'callback' || action === 'ticket') {
    route = action === 'callback' ? 'callback_requested' : 'help_desk_linked';
    records.push({ id: 'DEMO-TICKET-001', type: 'ticket', simulated: true, language, status: 'open',
      serviceOrder: context.serviceOrder, subject: DEMO_SCENARIOS.find(s => s.id === scenario)[language] });
    if (action === 'callback') records.push({ id: 'DEMO-CALLBACK-001', type: 'callback', simulated: true,
      language, status: 'requested', ticketId: 'DEMO-TICKET-001', serviceOrder: context.serviceOrder });
    add(copy[action]);
  }
  return { simulated: true, contentStatus: 'draft', language, route, transcript, context, records };
}

 ES:{adminPreview:'Vista de administración',storePreview:'Vista de tienda',workspace:'Comunicaciones y soporte · Revisión del cliente',eyebrow:'Una experiencia de soporte conectada',title:'Comunicaciones bilingües',storeTitle:'Soporte bilingüe para tiendas',subtitle:'Explore la propuesta de atención en inglés y español.',notice:'DEMOSTRACIÓN — Todas las llamadas, SMS, transferencias, tickets, devoluciones de llamada y órdenes son simulados. No se envían mensajes, no se crean tickets reales y no se usa el micrófono. Las traducciones requieren revisión del cliente.',draft:'BORRADOR · NO ACTIVO',setup:'Elija un escenario',scenario:'Ejemplo de atención',availability:'Disponibilidad simulada',available:'Representante bilingüe disponible',backup:'Principal no disponible · guardia disponible',unavailable:'Sin representantes disponibles',verified:'Simular identidad verificada',verifiedHelp:'Control de demostración; no verifica una identidad real.',consent:'Simular consentimiento para SMS',consentHelp:'Solo vista previa. Aún se necesitan los enlaces oficiales.',run:'Iniciar vista previa →',reset:'Reiniciar vista previa',safetyPolicy:'El acceso termina de inmediato al completar o cancelar el servicio. La llamada al 911 sigue siendo directa desde el dispositivo.',assistant:'Recepcionista virtual de RODLX',scripted:'Vista previa con guion · EN / ES',listen:'Escuchar saludo',agent:'Solicitar un agente',callback:'Solicitar devolución de llamada',ticket:'Vincular ticket de soporte',sms:'Vista previa del SMS',records:'Vista previa de tickets y llamadas',sampleOnly:'REGISTROS DE EJEMPLO',config:'3  Revisar los borradores de saludo',configHelp:'Edite el saludo en cualquiera de los dos idiomas. Los cambios solo se aplican a esta vista previa. Descárguelos para revisión; no modifican la configuración real.',download:'Descargar notas de revisión',needsApproval:'Contenido pendiente de aprobación',clientNumbers:'Se necesita número de soporte',clientAgents:'Se necesita cobertura de agentes };
const $ = id => document.getElementById(id);
let language='EN', current=null, currentAction='start';
const drafts={EN:DEMO_COPY.EN.greeting,ES:DEMO_COPY.ES.greeting};
$('greetingEN').value=drafts.EN; $('greetingES').value=drafts.ES;
const audience=()=>document.body.dataset.audience;
const setText=(node,text)=>{node.textContent=text;return node};
function block(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text)el.textContent=text;return el}
function renderLabels(){
 const t=LABELS[language];document.documentElement.lang=language.toLowerCase();
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
 $('pageTitle').textContent=audience()==='store'?t.storeTitle:t.title;
 $('english').setAttribute('aria-pressed',String(language==='EN'));$('spanish').setAttribute('aria-pressed',String(language==='ES'));
 const old=$('scenario').value;$('scenario').replaceChildren();
 DEMO_SCENARIOS.filter(s=>audience()!=='store'||['store','urgent','outage'].includes(s.id)).forEach(s=>{const o=block('option','',s[language]);o.value=s.id;$('scenario').append(o)});
 if([...$('scenario').options].some(o=>o.value===old))$('scenario').value=old;
 else $('scenario').value=audience()==='store'?'store':'delayed';
 $('audience').value=audience();renderResult();
}
function inputs(){return{language,scenario:$('scenario').value,availability:audience()==='store'?'unavailable':$('availability').value,verified:audience()==='admin'&&$('verified').checked,consent:$('consent').checked,action:currentAction}}
function run(action='start'){currentAction=action;current=simulateCommunication(inputs(),audience());renderResult()}
function renderResult(){
 const t=LABELS[language];$('conversation').replaceChildren();$('records').replaceChildren();$('feedback').textContent='';
 if(!current){const box=block('div','empty');box.append(block('div','empty-mark','◌'),block('p','',t.empty));$('conversation').append(box);$('outcome').hidden=true}
 else{
  current.transcript.forEach((line,i)=>{const b=block('div',`bubble ${line.speaker}`);b.append(block('span','speaker',line.speaker==='system'?t.system:t.assistantLabel));b.append(document.createTextNode(i===0?drafts[language]:line.text));$('conversation').append(b)});
  $('outcome').hidden=false;$('outcome').replaceChildren();
  const route=block('div','',t.route);route.append(block('strong','',t.routes[current.route]||current.route));
  const identity=block('div','',t.identity);identity.append(block('strong','',current.context.serviceOrder?t.verifiedLabel:t.unverifiedLabel));$('outcome').append(route,identity);
 }
 if(!current?.records.length)$('records').append(block('p','sub',t.emptyRecords));
 else current.records.forEach(record=>{const el=block('article','record');el.append(block('span','eyebrow',record.type==='ticket'?t.ticketLabel:t.callbackLabel),block('strong','',record.id),block('p','',record.type==='callback'?`${record.ticketId} · ${record.language}`:record.subject),block('p','',t.recordNote));$('records').append(el)});
}
$('english').onclick=()=>switchLanguage('EN');$('spanish').onclick=()=>switchLanguage('ES');
function switchLanguage(next){window.speechSynthesis?.cancel();language=next;renderLabels();if(current)run(currentAction)}
$('run').onclick=()=>run();$('reset').onclick=()=>{window.speechSynthesis?.cancel();current=null;currentAction='start';$('verified').checked=false;$('consent').checked=false;renderResult()};
['scenario','availability','verified','consent'].forEach(id=>$(id).onchange=()=>{if(current)run('start')});
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>run(button.dataset.action));
['EN','ES'].forEach(lang=>$(`greeting${lang}`).oninput=event=>{drafts[lang]=event.target.value;renderResult()});
$('audience').onchange=event=>{document.body.dataset.audience=event.target.value;current=null;currentAction='start';$('verified').checked=false;renderLabels()};
$('listen').onclick=()=>{
 const t=LABELS[language];if(!window.speechSynthesis){$('feedback').textContent=t.voiceUnavailable;return}
 const voice=window.speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(language.toLowerCase())&&v.localService);
 if(!voice){$('feedback').textContent=t.voiceMissing;return}
 window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(drafts[language]);utterance.lang=language==='ES'?'es-US':'en-US';utterance.voice=voice;window.speechSynthesis.speak(utterance);
};
$('download').onclick=()=>{
 const notes={status:'DRAFT_FOR_CLIENT_REVIEW',simulated:true,language,expiryPolicy:'Immediate on completion/cancellation; revoke old pair on reassignment',greetings:drafts,scenario:inputs(),preview:current,pendingClientInputs:['Telnyx credentials and numbers','Official app links','Bilingual content approval','Agent coverage and on-call contacts','Consent and retention policies']};
 const blob=new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=block('a');link.href=url;link.download='rodlx-communications-review.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('feedback').textContent=LABELS[language].downloadDone;
};
window.addEventListener('pagehide',()=>window.speechSynthesis?.cancel());
renderLabels();
</script>
</body></html>
