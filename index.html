<style>

pacing:.8px;font-weight:800;color:#66798d;text-transform:uppercase;margin-bottom:5px}.empty{text-align:center;margin:auto;color:var(--muted);padding:45px 20px;max-width:420px}.empty-mark{font-size:32px;margin-bottom:14px}.actions{border-top:1px solid var(--line);padding:16px 22px;display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}.outcome{margin-top:17px;border:1px solid #dce7d2;border-radius:12px;padding:15px;background:#f5f9ef;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.outcome strong{display:block;margin-top:5px;font-size:13px}.bottom{margin-top:22px}.records{display:grid;grid-template-columns:1fr 1fr;gap:12px}.record{padding:15px;border:1px solid var(--line);background:#fafbfd;border-radius:10px;font-size:12px}.record strong{display:block;margin:5px 0 9px}.record p{font-size:11px;color:var(--muted)}.config{margin-top:22px}.config summary{padding:20px 22px;cursor:pointer;font-size:14px;font-weight:750}.config-body{border-top:1px solid var(--line);padding:20px 22px}.copy-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.review-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.faq{border-top:1px solid var(--line);padding:14px 0}.faq summary{cursor:pointer;font-size:13px;font-weight:700;line-height:1.6}.faq p{font-size:13px;color:var(--muted);padding:10px 0 0}.faq-list{margin-top:16px}.footer-note{margin-top:25px;color:var(--muted);font-size:11px;line-height:1.7}.feedback{min-height:20px;font-size:12px;color:#61713b;margin-top:10px}.store-only{display:none}body[data-audience=store] .admin-only{display:none!important}body[data-audience=store] .store-only{display:block}body[data-standalone=false] .standalone-only{display:none}.route-pill{font-family:ui-monospace,monospace;font-size:11px}.reviewer{display:flex;gap:10px;align-items:center}.reviewer select{margin:0;font-size:12px;padding:6px}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){header{padding:18px}main{padding:22px 16px}.grid{grid-template-columns:1fr}.heading{align-items:flex-start}h1{font-size:24px}.copy-grid,.records{grid-template-columns:1fr}.top{align-items:flex-start}.reviewer{flex-direction:column;align-items:flex-end}.conversation{max-height:none}.outcome{grid-template-columns:1fr}.section{padding:18px}}

<body data-audience="admin" data-standalone="true">
<header><div class="top"><div><div class="brand">ROD<span>LX</span></div><div class="eyebrow" data-i18n="workspace"></div></div><div class="reviewer"><div class="languages" role="group" aria-label="Language"><button id="english" type="button" lang="en" aria-pressed="true">English</button><button id="spanish" type="button" lang="es" aria-pressed="false">Español</button></div><label class="standalone-only"><span class="screen-reader">Preview audience</span><select id="audience"><option value="admin" data-i18n="adminPreview"></option><option value="store" data-i18n="storePreview"></option></select></label></div></div></header>
<main>
<div class="notice" data-i18n="notice"></div>
<div class="heading"><div><div class="eyebrow" data-i18n="eyebrow"></div><h1 id="pageTitle"></h1><p class="sub" data-i18n="subtitle"></p></div><span class="pill warn" data-i18n="draft"></span></div>
<div class="grid">
<section class="card section"><h2 class="card-title"><span class="step">1</span><span data-i18n="setup"></span></h2>
<label class="field"><span data-i18n="scenario"></span><select id="scenario"></select></label>
<label class="field admin-only"><span data-i18n="availability"></span><select id="availability"><option value="available" data-i18n="available"></option><option value="backup" data-i18n="backup"></option><option value="unavailable" data-i18n="unavailable"></option></select></label>
<label class="check admin-only"><input type="checkbox" id="verified"><span><b data-i18n="verified"></b><br><span data-i18n="verifiedHelp"></span></span></label>
<label class="check"><input type="checkbox" id="consent"><span><b data-i18n="consent"></b><br><span data-i18n="consentHelp"></span></span></label>
<p class="help store-only" data-i18n="storeScope"></p>
<button class="button primary full" id="run" type="button" data-i18n="run"></button><button class="button full" id="reset" type="button" data-i18n="reset"></button>
<p class="help" data-i18n="safetyPolicy"></p>
</section>
<div>
<section class="card"><div class="conversation-header"><div class="identity"><div class="avatar">R</div><div><div style="font-size:13px;font-weight:750" data-i18n="assistant"></div><div class="help" style="margin:1px 0" data-i18n="scripted"></div></div></div><button type="button" class="button" id="listen" data-i18n="listen"></button></div>
<div id="conversation" class="conversation" aria-live="polite"></div>
<div class="actions"><button class="button" data-action="agent" data-i18n="agent"></button><button class="button" data-action="callback" data-i18n="callback"></button><button class="button" data-action="ticket" data-i18n="ticket"></button><button class="button soft" data-action="sms" data-i18n="sms"></button></div>
</section>
<div id="outcome" class="outcome" hidden></div><p id="feedback" class="feedback" role="status"></p>
</div>
</div>
<section class="card section bottom"><h2 class="card-title"><span class="step">2</span><span data-i18n="records"></span> <span class="pill" style="float:right" data-i18n="sampleOnly"></span></h2><div id="records" class="records"></div></section>
<section class="card section bottom"><h2 class="card-title"><span class="step">3</span><span data-i18n="knowledgeTitle"></span></h2><p class="sub" data-i18n="knowledgeHelp"></p><div id="knowledge" class="faq-list"></div></section>
<details class="card config admin-only"><summary data-i18n="config"></summary><div class="config-body"><p class="sub" data-i18n="configHelp"></p><div class="copy-grid"><label class="field">English<textarea id="greetingEN" lang="en" maxlength="2000"></textarea></label><label class="field">Español<textarea id="greetingES" lang="es" maxlength="2000"></textarea></label></div><button class="button" id="download" data-i18n="download"></button><div class="review-list"><span class="pill warn" data-i18n="needsApproval"></span><span class="pill" data-i18n="clientNumbers"></span><span class="pill" data-i18n="clientAgents"></span></div></div></details>
<p class="footer-note" data-i18n="footer"></p>
</main>
<script>
// Client-review simulation only. No provider, database, account lookup, or external requests.

    parts_deposit: "Some service requests may require parts procurement and a deposit. Review the parts estimate and any required approvals in the app before proceeding. The assistant cannot waive a deposit, approve substitute parts, or authorize an additional charge. If parts or prices change, use the established approval process or request support.",

    privacy: "Masked communications are intended to keep personal telephone numbers hidden from the other service participant. Only the current authorized customer–technician pair may communicate for an active service order. Reassignment revokes the old pair; completion or cancellation ends access immediately. Report unexpected calls or incorrect routing to support.",
    help_center: "Keep the existing support options: Live Chat, Help Center, Support Ticket, and Call Us. The Help Center should use approved articles and FAQs. A ticket is appropriate when an issue needs tracking or follow-up; a basic information request does not automatically need a ticket. This preview creates only fictional records.",
    complaint: "I can help summarize your concern for an authorized representative. In a live workflow, verified order context and the relevant issue summary would accompany the escalation. The assistant cannot promise a resolution, payment adjustment, refund, or technician disciplinary outcome. A support ticket can track necessary follow-up.",
    store_pickup_delay: "For a store pickup delay, store staff should review their own order reference, readiness status, and pickup coordination in Store Hub. Do not mark parts ready until they are actually ready or promise an unconfirmed pickup time. Request support if coordination cannot be resolved. No real store order is accessed in this demo.",

    callbackPolicy: "Live callback hours, bilingual staffing, and response targets still need client confirmation. A callback request is not a promise of immediate help or a guaranteed response time. If the concern is urgent or involves immediate danger, use the appropriate human support route or call 911 as applicable.",
    languageHelp: "You may review this journey in English or Spanish and switch languages during the demonstration. In the live system, the selected language should accompany support transfers, callback requests, and Help Desk tickets. Actual bilingual agent coverage must be confirmed by operations.",
    greeting: 'Welcome to RODLX, your roadside assistance and mobile vehicle care partner. If you are in immediate danger, please call 911. For urgent roadside support, press 1. For all other assistance, please stay on the line.',
    intro: 'I am the RODLX demo virtual assistant. How may I assist you?',
    verify: 'Before sharing private service information, we must verify your identity. Your caller ID alone does not establish identity.',
    delayed: 'In this sample order, a CARELX technician is assigned. The previous ETA has passed, and there is no confirmed updated ETA. Would you like human support?',
    registration: 'Service requests must be submitted through the RODLX Customer App. Register, enter your vehicle and location, review the estimate, complete Stripe authorization, and approve applicable parts deposits before Smart Dispatch can offer an assignment.',

    fallback: 'The AI receptionist is unavailable in this simulated scenario. Press 1 for priority roadside support, or request a callback.',
    warm: 'Simulated warm transfer: an available bilingual representative receives the caller language and concern summary. Private order details are included only after verification.',

    unavailable: 'No representative is available in this simulation. We cannot promise immediate assistance. You may request a callback and support follow-up.',
    callback: 'A demo callback request is linked to a demo Help Desk ticket. No real callback has been scheduled.',
    ticket: 'A demo support ticket is linked to this interaction. No live Help Desk record has been created.',
    consent: 'SMS preview is blocked until customer consent is selected. No text messages are sent by this demo.',

  ES: {
    services: "RODLX tiene tres categorías de servicio: Asistencia vial de emergencia; Lavado y detallado móvil de vehículos; y Cuidado y mantenimiento móvil de vehículos. La aplicación debe confirmar los servicios disponibles para su vehículo y ubicación. Esta demostración no confirma cobertura ni disponibilidad.",

    help_center: "Se conservan las opciones existentes: Chat en vivo, Centro de ayuda, Ticket de soporte y Llámenos. El Centro de ayuda debe utilizar artículos y preguntas frecuentes aprobados. Un ticket corresponde cuando un problema requiere seguimiento; una consulta informativa no necesita un ticket automáticamente. Esta vista previa solo crea registros ficticios.",

function getDemoKnowledge(language = 'EN', audience = 'admin') {
  if (!['EN', 'ES'].includes(language)) throw Object.assign(new Error('Invalid demo language.'), { statusCode: 400 });
  getDemoScenarios(audience);
  return DEMO_FAQS.filter(faq => audience === 'admin' || faq.store).map(faq => ({
    key: faq.key, question: faq[language], answer: DEMO_COPY[language][faq.key], contentStatus: 'draft',
  }));
}

function simulateCommunication(input = {}, audience = 'admin') {
  const { language = 'EN', scenario = audience === 'store' ? 'store' : 'delayed',
    verified = false, consent = false, availability = 'available', action = 'start' } = input;
  if (!['EN', 'ES'].includes(language) || !DEMO_SCENARIOS.some(s => s.id === scenario) ||
      !['available', 'backup', 'unavailable'].includes(availability) ||
      !['start', 'agent', 'callback', 'ticket', 'sms'].includes(action) ||
      typeof verified !== 'boolean' || typeof consent !== 'boolean' || !['admin', 'store'].includes(audience)) {
    throw Object.assign(new Error('Invalid demo scenario input.'), { statusCode: 400 });
  }
  const selectedScenario = DEMO_SCENARIOS.find(item => item.id === scenario);
  if (!getDemoScenarios(audience).some(item => item.id === scenario)) {
    throw Object.assign(new Error('This scenario is not available in the store preview.'), { statusCode: 403 });
  }
  const copy = DEMO_COPY[language];
  const transcript = [{ speaker: 'system', text: copy.greeting }];
  const add = text => transcript.push({ speaker: 'assistant', text });
  let route = scenario === 'outage' ? 'keypad_fallback' : 'ai_demo';
  const records = [];
  const privateScenario = Boolean(selectedScenario.private);
  const context = { verified: privateScenario && verified, language, scenario, serviceOrder: null };
  if (scenario === 'expired') {
    add(copy.expired);
    return { simulated: true, contentStatus: 'draft', language, route: 'access_ended', transcript, context, records };
  }
  if (privateScenario && !verified) {
    add(copy.verify);
    return { simulated: true, contentStatus: 'draft', language, route: 'verification_required', transcript, context, records };
  }
  if (privateScenario) context.serviceOrder = 'DEMO-ORDER-001';
  if (scenario !== 'urgent') add(scenario === 'outage' ? copy.fallback : copy.intro);
  if (!['outage', 'masked'].includes(scenario)) add(copy[scenario === 'registration' ? 'registration' : scenario === 'urgent' ? 'safety' : scenario]);

  if (scenario === 'services') {
    for (const category of ['roadside', 'wash', 'maintenance']) add(copy[category]);
  }
  if (scenario === 'registration' || scenario === 'booking_guidance') add(copy.languageHelp);
  if (action === 'callback') add(copy.callbackPolicy);

  if (action === 'sms' || scenario === 'masked') {
    route = consent ? 'sms_preview' : 'consent_required';
    add(consent ? (scenario === 'masked' ? copy.masked : scenario.startsWith('store') ? copy.storeSms : copy.sms) : copy.consent);
  }
  if ((selectedScenario.human && action === 'start') || action === 'agent') {
    route = availability === 'available' ? 'warm_transfer' : availability === 'backup' ? 'on_call_backup' : 'callback_offered';
    add(copy[availability === 'available' ? 'warm' : availability === 'backup' ? 'backup' : 'unavailable']);
  }
  if (action === 'callback' || action === 'ticket') {
    route = action === 'callback' ? 'callback_requested' : 'help_desk_linked';
    records.push({ id: 'DEMO-TICKET-001', type: 'ticket', simulated: true, language, status: 'open',
      serviceOrder: context.serviceOrder, subject: DEMO_SCENARIOS.find(s => s.id === scenario)[language] });
    if (action === 'callback') records.push({ id: 'DEMO-CALLBACK-001', type: 'callback', simulated: true,
      language, status: 'requested', ticketId: 'DEMO-TICKET-001', serviceOrder: context.serviceOrder });
    add(copy[action]);
  }
  return { simulated: true, contentStatus: 'draft', language, route, transcript, context, records };
}

const $ = id => document.getElementById(id);
let language='EN', current=null, currentAction='start';
const drafts={EN:DEMO_COPY.EN.greeting,ES:DEMO_COPY.ES.greeting};
$('greetingEN').value=drafts.EN; $('greetingES').value=drafts.ES;
const audience=()=>document.body.dataset.audience;
const setText=(node,text)=>{node.textContent=text;return node};
function block(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text)el.textContent=text;return el}
function renderLabels(){
 const t=LABELS[language];document.documentElement.lang=language.toLowerCase();
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
 $('pageTitle').textContent=audience()==='store'?t.storeTitle:t.title;
 $('english').setAttribute('aria-pressed',String(language==='EN'));$('spanish').setAttribute('aria-pressed',String(language==='ES'));
 const old=$('scenario').value;$('scenario').replaceChildren();
 getDemoScenarios(audience()).forEach(s=>{const o=block('option','',s[language]);o.value=s.id;$('scenario').append(o)});
 if([...$('scenario').options].some(o=>o.value===old))$('scenario').value=old;
 else $('scenario').value=audience()==='store'?'store':'delayed';
 $('audience').value=audience();renderKnowledge();renderResult();
}
function renderKnowledge(){
 $('knowledge').replaceChildren();
 getDemoKnowledge(language,audience()).forEach(faq=>{const item=block('details','faq');item.append(block('summary','',faq.question),block('p','',faq.answer));$('knowledge').append(item)});
}
function inputs(){return{language,scenario:$('scenario').value,availability:audience()==='store'?'unavailable':$('availability').value,verified:audience()==='admin'&&$('verified').checked,consent:$('consent').checked,action:currentAction}}
function run(action='start'){currentAction=action;current=simulateCommunication(inputs(),audience());renderResult()}
function renderResult(){
 const t=LABELS[language];$('conversation').replaceChildren();$('records').replaceChildren();$('feedback').textContent='';
 if(!current){const box=block('div','empty');box.append(block('div','empty-mark','◌'),block('p','',t.empty));$('conversation').append(box);$('outcome').hidden=true}
 else{
  current.transcript.forEach((line,i)=>{const b=block('div',`bubble ${line.speaker}`);b.append(block('span','speaker',line.speaker==='system'?t.system:t.assistantLabel));b.append(document.createTextNode(i===0?drafts[language]:line.text));$('conversation').append(b)});
  $('outcome').hidden=false;$('outcome').replaceChildren();
  const route=block('div','',t.route);route.append(block('strong','',t.routes[current.route]||current.route));
  const identity=block('div','',t.identity);identity.append(block('strong','',current.context.serviceOrder?t.verifiedLabel:t.unverifiedLabel));$('outcome').append(route,identity);
 }
 if(!current?.records.length)$('records').append(block('p','sub',t.emptyRecords));
 else current.records.forEach(record=>{const el=block('article','record');el.append(block('span','eyebrow',record.type==='ticket'?t.ticketLabel:t.callbackLabel),block('strong','',record.id),block('p','',record.type==='callback'?`${record.ticketId} · ${record.language}`:record.subject),block('p','',t.recordNote));$('records').append(el)});
}

};
$('download').onclick=()=>{
